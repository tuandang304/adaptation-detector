# R12-PLoss-Ctrl: Causal loss-only control for PAMR-Lite (identical TAL prototype losses, out_proj frozen at 0)
smoke: false
data_dir: /tmp/bench_data
model: yolo26n
epochs: 30
imgsz: 640
seed: 0
eval_splits: [valid, night, nightrain, duskrain, dayrain]
shift_eval: false
export_gt: false
causal_eval: false
mods: [divdet, pamrloss]
gpu_plan: [[bdd]]
extra: {optimizer: MuSGD, lr0: 0.01, lrf: 0.01, momentum: 0.9, warmup_bias_lr: 0.0}
