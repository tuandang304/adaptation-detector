# R12-Ctrl: stock YOLO26n + Div-Ldet (seed 0, pooled_shift + GT export control)
smoke: false
data_dir: /tmp/bench_data
model: yolo26n
epochs: 30
imgsz: 640
seed: 0
eval_splits: [valid, night, nightrain, duskrain, dayrain]
shift_eval: false
export_gt: true
causal_eval: false
mods: [divdet]
gpu_plan: [[bdd]]
extra: {optimizer: MuSGD, lr0: 0.01, lrf: 0.01, momentum: 0.9, warmup_bias_lr: 0.0}
