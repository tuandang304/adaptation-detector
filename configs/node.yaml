# R11-A1-Seed1: M10-A stock YOLO26n + Div-Ldet (seed 1 variance control)
smoke: false
data_dir: /tmp/bench_data
model: yolo26n
epochs: 30
imgsz: 640
seed: 1
eval_splits: [valid, night, nightrain, duskrain, dayrain]
