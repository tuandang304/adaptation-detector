# Round 8: P4 = P3 + second routing tap (3.conv) for shifts invisible at conv0; robust source fine-tune (shard env: STREAM, WEIGHTS, AUGMIX, METHODS).
model: yolo11n.pt
imgsz: 640
batch: 4
seed: 0
source_images: 500
taps: [4, 16, 19, 22]
signal_taps: ["0.conv"]
signal2: "3.conv"
# robust_ft only runs when ROBUST_FT=1 (training shards); eval shards pass WEIGHTS=<pt>
robust_ft: {epochs: 8, batch: 64, lr0: 0.002, augmix: 0.5, severity: 3}
trigger_window: 15
stream:
  split: val
  phases: [clean, fog, gaussian_noise, motion_blur, snow, contrast, clean]
  per_phase: 500
  severity: 5
  same_clean_ids: true
streams:
  cyc7: {}
  longclean: {per_phase: 200, phases: [clean, clean, fog, clean, clean, gaussian_noise, clean, clean, motion_blur, clean, clean, snow, clean, clean, contrast, clean, clean]}
  heldout: {per_phase: 440, phases: [clean, defocus_blur, frost, jpeg_compression, brightness, pixelate, shot_noise, clean]}
P3: &P3 {bn_momentum: 0.05, bn_anchor: 0.01, route: true, route_hyst: true, route_low_q: rq90, cp_mode: dom, cp_z: 3.0, cp_persist: 2, cp_cool: 8, reset_on_shift: true}
methods:
  - {name: frozen}
  - {name: bnema_always, bn_momentum: 0.05, bn_anchor: 0.01}
  - {name: norm_prior0.8, bn_mode: norm, bn_prior: 0.8}
  - {name: dua, bn_momentum: 0.1, bn_mom_decay: 0.94, bn_mom_min: 0.005}
  - {name: artta_style, bn_mode: artta, bn_gamma: 10.0}
  - {name: mecta_norm_style, bn_mode: mecta}
  - {name: rdumb_250, bn_momentum: 0.05, bn_anchor: 0.01, reset_every: 250}
  - {name: ersk_style, bn_momentum: 0.05, bn_anchor: 0.01, cp_mode: zpeak, cp_z: 3.0, cp_cool: 8}
  - {<<: *P3, name: P3_dense}
  - {<<: *P3, name: P4_dense, route2: true}
  - {<<: *P3, name: P3_b0.1_d30, bn_budget: 0.1, dense: 30}
  - {name: oracle_reset, bn_momentum: 0.05, bn_anchor: 0.01, oracle: true}
  - {name: frozen_end}
